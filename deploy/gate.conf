# 對外閘門：Cloudflare Tunnel 只連到這裡，只放行前台需要的路徑。
# 網站本身會把所有 /api/* 轉給後端（含爬蟲、審核、管線等後台操作，沒有密碼），不能直接公開。
limit_req_zone $http_cf_connecting_ip zone=assistant:10m rate=20r/m;
limit_req_zone $http_cf_connecting_ip zone=writes:10m rate=30r/m;
limit_req_status 429;

upstream web { server web:3000; keepalive 16; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

    # 小幫手：整理需求登記要等本地 AI，逾時與網站的 330 秒對齊；每個訪客每分鐘 20 次
    location ~ ^/api/assistant(/warmup)?$ {
        limit_req zone=assistant burst=10 nodelay;
        proxy_read_timeout 340s;
        proxy_pass http://web;
    }

    # 訴求專區與需求登記（寫入也限速）
    location ~ ^/api/(demands|appeals)(/|$) {
        limit_req zone=writes burst=15 nodelay;
        proxy_pass http://web;
    }

    # 前台唯讀 API 與健康檢查
    location ~ ^/api/(public/|health$) {
        proxy_pass http://web;
    }

    # 其餘 /api/*（爬蟲、審核、管線、原始資料…）不對外
    location /api/ { return 404; }

    # 開發用頁面不對外（後台 /admin 有密碼，保留）
    location ~ ^/(data-center|registry) { return 404; }

    location / { proxy_pass http://web; }
}
