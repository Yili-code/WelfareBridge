# 媒合黃金集：每筆補助的「資格骨幹」標準答案。由 Claude 逐筆閱讀官方原文標註（抽樣原文：scripts/eval_matching.py --dump 可重現），可抽查。
# residence：national＝無縣市限制；[縣市]＝須設籍／居住於這些縣市（basis: household 戶籍 | current 居住 | either | school 就讀學校所在地）
# age：受補助者本人年齡 [min, max]（含端點，null＝無上限／下限）；via_child：家長代未成年子女申請也適用（子女年齡落在 age 內）
# education：限定學制（registry education.level 值）；student：必須在學（true）／不得在學（false）
# identity_all：全部都要具備的身分；identity_any：每一組至少具備一個；identity_exclude：具備即不符
# nationality：roc 本國籍 | foreign 外籍；attrs：其他可結構化的必要條件（registry 屬性 → 值）
# other：無法結構化的關鍵條件（使用者沒提供時應歸「需補充」）；note：標註說明
