# Official Source Validation 規則
#
# 一個來源要被標記 source_verified = true，必須同時滿足：
#   1. HTTPS
#   2. 網域符合 suffix_rules，或列在 whitelist 中
#   3. 若網域是 edu.tw 但不是 whitelist 裡的政府機關，必須符合 public_school_domains（公立學校）
#   4. 抓到的頁面 <title> 含 expected_title_keywords（在 sources.yaml 逐一設定）
# 不符合的來源：source_verified = false, source_status = needs_review，資料不得進正式資料表。

suffix_rules:
  - suffix: gov.tw
    domain_type: government
    note: 中央與地方政府機關網域（含各縣市政府、區公所、教育局處、開放資料平臺）
  - suffix: gov.taipei
    domain_type: government
    note: 臺北市政府機關使用 *.gov.taipei（社會局、衛生局、檔案伺服器 www-ws）
  - suffix: edu.tw
    domain_type: education
    note: 教育部（www.edu.tw）、各縣市教育網、學校；需再依 whitelist / public_school_domains 判斷

# 明確白名單：host → 機關資訊（優先於 suffix 推論）
