# 關鍵字過濾／分類的「種子」規則（v2）。
#
# 這份只是語料統計前的起始值：讓第一次爬取時能把「明顯不是補助」的頁面擋掉。
# 正式使用的關鍵字由 `python -m benefit_crawler --mine-keywords` 依實際爬回的語料統計產生
# （benefit_crawler/config/keyword_rules_v2.yaml + docs/generated/keyword-report.md），存在時自動優先使用。
version: 2
source: seed
benefit_signal:
  threshold: 4
  title_bonus: 2
  keywords:
    - {term: 補助, weight: 3}
    - {term: 津貼, weight: 3}
    - {term: 給付, weight: 3}
    - {term: 獎學金, weight: 3}
    - {term: 獎助, weight: 3}
    - {term: 助學金, weight: 3}
    - {term: 減免, weight: 2}
    - {term: 救助, weight: 2}
    - {term: 扶助, weight: 2}
    - {term: 申請資格, weight: 3}
    - {term: 補助對象, weight: 3}
    - {term: 服務對象, weight: 3}
    - {term: 申請方式, weight: 2}
    - {term: 應備文件, weight: 2}
    - {term: 補助標準, weight: 2}
    - {term: 補助金額, weight: 2}
  negative:
    - {term: 招標, weight: -5}
    - {term: 決標, weight: -5}
    - {term: 採購, weight: -4}
    - {term: 徵才, weight: -4}
    - {term: 甄選結果, weight: -4}
    - {term: 隱私權政策, weight: -3}
    - {term: 網站導覽, weight: -2}
    - {term: 資訊安全政策, weight: -3}
    - {term: 瀏覽人次, weight: -1}
    - {term: 新聞稿, weight: -2}
    - {term: 草案, weight: -4}
    - {term: 修正草案, weight: -4}
    - {term: 公聽會, weight: -3}
    - {term: 徵求意見, weight: -3}
    - {term: 招生簡章, weight: -2}
    - {term: 研習, weight: -2}
    - {term: 課程表, weight: -2}
    - {term: 秩序冊, weight: -3}
    - {term: 民意信箱, weight: -1}
    - {term: 網站地圖, weight: -2}
