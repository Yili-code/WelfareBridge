# 官方資料來源登錄（v2）。
#
# 每個來源對應一個 crawler class（都繼承 benefit_crawler.base.base_crawler.BaseCrawler）。
# 新來源多半只要用 benefit_crawler.generic.page_crawler.GenericPageCrawler + pages 清單即可，不需要寫程式。
#
# data_confidence：官方原始公告 100、官方政府網站彙整／轉載 90～95、官方學校公告 95（資料可信度，不代表法律效力）
# provider_type：mixed 代表「每一筆資料的機關由頁面上的機關名稱決定」
#
# GenericPageCrawler 設定：
#   pages:            [{url, title, seed_category, organization（逐頁覆寫主辦機關）, format: html|pdf|csv|json|xml, data_kind: text|providers|statistics,
#                       provider_kind, source_page, skip, skip_reason}]
#   content_selectors: 主內容區 CSS selector（依序嘗試；沒命中就用啟發式：最大且連結比例低的區塊）
#   split_selector:   一頁多方案時，每個區塊拆成一份文件（例如台灣就業通的分頁）
#   follow_links:     {depth: 1, allow: [regex], deny: [regex], max_links: N}  只追同網域、白名單內的連結
#   seed_category:    來源頁面在 source.xlsx 中的名稱所對應的類別（只當語料統計的種子標籤，分類器仍會重新判斷）

defaults:
  request_delay_seconds: 1.0
  max_pages: 3
  max_items: 300

sources:
