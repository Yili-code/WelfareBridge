  # 候選來源：臺東縣政府社會處（taisoc.taitung.gov.tw）＋ 生育補助（縣府民政處方案；戶政事務所網站與縣府 TTBABY 育兒入口網各有一頁）
  # 網站結構（social.taitung.gov.tw 不存在，社會處官網是 taisoc.taitung.gov.tw，首頁轉址到 /WebSite/Page/index.aspx）：
  #   服務項目總覽 /WebSite/Service/serviceMain.aspx?menuid=lW%2bfKiAxClc%3d（科 → 類 → 子類）
  #   分類頁 /WebSite/Service/service.aspx?menuid=…&cate=<類>；子類清單 /WebSite/Service/servicelist.aspx?menuid=…&cate=<子類>&listall=1
  #   方案內容頁 /WebSite/Service/serviceDetail.aspx?menuid=lW%2bfKiAxClc%3d&page=1&id=<base64 id>（id 內的 / 以 !0! 表示、+ 以 %2b 表示）
  #   內容頁是靜態 HTML：div.inside_main 內一個 table，固定欄位「類別／申請項目／申請期限／申請地點／申請條件／申請須檢附文件／補助金額／作業天數／連絡窗口／備註／相關檔案」，
  #   <title> 一律是「臺東縣政府社會處-服務項目」，方案名稱取 pages 的 title。
  #   robots.txt：Allow /WebSite/*，Disallow /App_ → 附件 (/App_File/File.ashx) 與清單頁的跳轉連結 (/App_File/Link.ashx → 301 → serviceDetail.aspx) 都不能抓，
  #   所以不設 follow_links（清單頁只透過 Link.ashx 連到內容頁），也不登錄 PDF 附件；只在內文寫「詳如附件」的方案不收。
