#   業務總表：News.aspx?n=21123&sms=19317（3 頁，page=1..3&PageSize=20）
#   業務內容頁：News_Content_Table.aspx?n=21123&s=<業務 id>（表格：類別／單位／辦理時限／聯絡電話／注意事項(資格)／應附文件）
#   主內容區：#CCMS_Content
content_selectors: ["#CCMS_Content"]
notes: "區公所業務頁只有「注意事項（資格）＋應附文件」，多半沒有給付金額；金額條文在社會局 sab.tainan.gov.tw（tainan_sw 來源）。生育獎勵金在臺南市由戶政事務所受理，區公所網站沒有方案頁；老人津貼（中低收入老人生活津貼、重陽敬老金）也不在區公所業務總表。"
