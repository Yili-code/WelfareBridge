# 高雄市各區公所共用樣板（高雄市政府 CMS，與臺北 CCMS 同一家系）。網址型態：
#   cp.aspx?n=<單元>[&s=<子頁>]                    課室介紹等靜態頁（主內容 #ContentPlaceHolder1_data_midlle_cp）
#   News.aspx?n=<單元>&sms=<子單元>[&page=N]        清單頁（單一窗口服務事項、表單下載、常見問答、申請案件作業流程圖…）
#   News_Content.aspx?n=<單元>&sms=<子單元>&s=<文章>  內容頁（主內容 #data_midlle；#content_middle 會多帶麵包屑與「回上一頁」）
#   Content_List.aspx?n=<單元>                        分類目錄頁（只有選單）
# <title> 格式「三民區公所-<頁名>」；內文標題在 .data_midlle_news_box01 dt。
# 三民區公所真正寫出資格＋給付＋申請方式的 HTML 頁只有「單一窗口服務事項」的老人健保費補助與「表單下載」的急難救助須知；
# 「申請案件作業流程圖」各頁只有一句公文流程、「表單下載」的各項須知只有附件、社政業務申辦頁只是業務清單；
# 各方案的金額與資格條件都寫在「常見問答(FAQ)／社政業務」的 Q: 頁（收錄政策排除 FAQ，故只列 skip 供參考）。
content_selectors: ["#data_midlle", "#ContentPlaceHolder1_data_midlle_cp", "#content_middle"]
