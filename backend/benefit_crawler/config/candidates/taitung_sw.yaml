#   與縣府育兒入口網 ttbaby.taitung.gov.tw（舊版文字，主內容 div.doc-content）各一頁；兩站 robots.txt 都允許。
# 社會處網站沒有「低收入戶／中低收入戶生活扶助」與「身心障礙者生活補助」的專頁（服務項目與全站搜尋都找不到；身障「身心津貼轉型專區」是空的）。
