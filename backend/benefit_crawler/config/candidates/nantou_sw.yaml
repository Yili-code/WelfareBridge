#   方案內容頁網址型態 https://welfare.nantou.gov.tw/1486/<slug>，但靜態 HTML 只有標題與選單（<div class="table-block b2-1 noJSarea"> 內只有 h2）。
#   內文由頁面載入後的 _fetchPage() 以 POST 送到 <input id="PartialUrl">（/1486/P_Word/Info/<MNU_ID>/<guid>）取得，
#   需帶 .search-menu 內的 __RequestVerificationToken 與同一連線的 cookie；直接 GET 該 partial 回 404，無 token 的 POST 被 WAF 擋（Request Rejected）。
