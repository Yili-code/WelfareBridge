id: bli_family
name: 勞動部勞工保險局 — 生育給付（勞保、國保、農保）、勞工生育補助、育嬰留職停薪津貼
organization: 勞動部勞工保險局
provider_type: central_government
source_type: government_site
base_url: https://www.bli.gov.tw/
crawler: benefit_crawler.generic.page_crawler.GenericPageCrawler
expected_title_keywords: [勞工保險局]
data_confidence: 100
enabled: true
domains: [labor, social_welfare]
# 勞保局網站每頁都是 /NNNNNNN.html；主內容在 div.content > #divContent（h1 + .text-area + 最後更新日期），
# 其後的 .fatfooter-zone 是全站選單，用 #divContent 才不會把選單當內文。
content_selectors: ["#divContent", "div.content"]
# 說明：勞保局把每項給付拆成「請領資格／給付標準／請領手續」三個分頁（各自一個 URL），沒有單頁完整說明；
# 因此勞保生育給付、就保育嬰留職停薪津貼、國保生育給付各以 2～3 份文件收錄，標題以「方案名 — 段落名」標示，
# 由主流程依方案名合併。農保生育給付、加給補助與各項「要點」則是單頁完整（資格＋金額＋手續）。
# 所有網址不共用型態（純流水號），故不設 follow_links，只收明列的頁面。
