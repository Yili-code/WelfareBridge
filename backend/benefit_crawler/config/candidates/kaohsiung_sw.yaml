name: 高雄市政府社會局 — 生育、育兒、社會救助、老人福利
organization: 高雄市政府社會局
provider_type: local_government
source_type: government_site
base_url: https://socbu.kcg.gov.tw/
crawler: benefit_crawler.generic.page_crawler.GenericPageCrawler
expected_title_keywords: [高雄市政府社會局]
data_confidence: 100
enabled: true
domains: [social_welfare, long_term_care, disability]
# 方案內容頁網址型態：index.php?prog=2&b_id=<分類>&m_id=<段落>&s_id=<方案>
# 主內容在 div.diva1；方案名在 h3 > div.bar2，<title> 只有分類名（例如「社會救助 - 高雄市政府社會局」），故 pages 都寫明 title
content_selectors: ["div.diva1", ".divbody"]
follow_links:
  depth: 1
  # 只追分類目錄頁裡「經濟補助／津貼／救助」段落（m_id）的方案頁：
  #   2 兒少經濟扶助｜33 低收入戶救助｜34 津貼／補助｜36 急難救助｜259 脫貧加倍佳｜23 老人經濟扶助｜126 托育經濟補助｜
  #   39 單親福利措施｜135 特殊境遇家庭扶助｜205 身障經濟補助
  # 不追 m_id=26/27/357/358（長青學苑、老人活動中心、安養機構介紹等服務介紹頁）與 208/211（輔具服務站點、線上申請、機構名單），
  # 這些段落裡真正有補助內容的頁面已明列在 pages
  # act=link 是外站轉址；b_id=1/23 是捐贈碼與隱私權頁；s_id=1761/1762/558/559/748/1926 只有法規或指向他局的一句話，沒有方案內文
  allow: ['index\.php\?prog=2&b_id=\d+&m_id=(2|23|33|34|36|39|126|135|205|259)&s_id=\d+$']
  deny: ["act=link", "news_show", "download", "prog=1&", "prog=3&", "prog=4&", "b_id=1&", "b_id=23&", "facebook", 's_id=(1761|1762|558|559|748|1926)$']
  max_links: 40
