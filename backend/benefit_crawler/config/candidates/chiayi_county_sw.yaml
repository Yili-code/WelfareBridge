notes: 嘉義縣社會局全球資訊網（CCMS 站台）。任務給的 social.cyhg.gov.tw 無法解析；正確網址為 sabcc.cyhg.gov.tw（cyhg.gov.tw 子網域）。內容頁有 cp.aspx?n=<id> 與 News_Content.aspx?n=<分類>&s=<id> 兩種型態，內文都在 #CCMS_Content，每頁固定有「※服務對象／※福利內容（補助標準）／※申請方式（應備文件）」段落。生育補助由戶政事務所受理但頁面在社會局站台（婦女福利科），不需覆寫 organization。不收：居家式托育服務（托育人員資格）、獨居老人通報（通報服務）、特境扶助 SOP（只有連結）。
