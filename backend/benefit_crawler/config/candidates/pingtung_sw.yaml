name: 屏東縣政府社會處 — 生育、育兒、社會救助、老人福利
organization: 屏東縣政府社會處
provider_type: local_government
source_type: government_site
# https://www.pthg.gov.tw/planjdp/ 會 301 到 /planjdp/Default.aspx；robots.txt 為 Allow: /。
# 同一縣府主機上還有三個子站也收：民政處 /plancab/（生育津貼）、便民E櫃檯 /e-service/page_1_X_Y.html（靜態方案頁）、
# 高齡友善資訊網 elder.pthg.gov.tw（老人福利方案頁）。跨機關的頁面逐頁用 organization 覆寫。
base_url: https://www.pthg.gov.tw/planjdp/
crawler: benefit_crawler.generic.page_crawler.GenericPageCrawler
# 只驗 base_url 首頁的 <title>（「社會處」）；子站頁面的 <title> 不同（民政處、便民E櫃檯、高齡友善資訊網），不受影響。
expected_title_keywords: [社會處, 屏東縣政府社會處]
data_confidence: 100
enabled: true
domains: [social_welfare, long_term_care, disability]
# 依序嘗試：
#  1–3. 社會處 CMS（cp.aspx）：主內容在 #ContentPlaceHolder1_data_midlle_cp 內的 <table role=presentation>，第 1 列是分頁籤、第 2 列的 <div> 才是方案內文，先取第 2 列。
#  4.   便民E櫃檯 /e-service/ 靜態頁：方案內文在 .info-content（申辦單位／資格／應備文件／金額）。
#  5.   高齡友善資訊網 elder.pthg.gov.tw：內文在 <main id="article">。
# 注意 planjdp 頁也有 #content_middle / main，所以子站 selector 一定要排在社會處 selector 之後。
content_selectors: ["#ContentPlaceHolder1_data_midlle_cp > table > tr:nth-of-type(2) > td > div", "#ContentPlaceHolder1_data_midlle_cp", "#data_midlle", ".info-content", "#article"]
follow_links:
  depth: 1
  # 只追「同一主題群組」底下的分頁籤（cp.aspx?n=<群組>&s=<分頁>），群組 n 值固定列出；其餘 cp.aspx?n= 都是站台導覽（關於我們、法規、統計…），不追。
  allow: ["cp\\.aspx\\?n=(A4164DF4295ED9D4|51E132D99F254E3B|6002B120E13BE406|1D92213B0F4404A4|76661B637A6124F3|E0A09A05B11AF1A2|B808E022206BD40E|A7CCB761096F7FA3|920104B7056B7226|9463987D224BAA6B|9F8B99754361E42D)&s=[0-9A-F]{16}$"]
  deny:
    - "News"
    - "Content_List"
    - "Link\\.aspx"
    - "SiteMap"
    - "Default\\.aspx"
    - "HitCount"
    - "Download"
    - "Photo"
    - "Video"
    - "Cus_"
    - "onestop\\.pthg"
    - "socmap"
    - "ptlaw"
    # 第 1 輪乾跑看到的純連結分頁籤／名冊／簡介（94–450 字、沒有資格與給付內容），不追
    - "s=(F4DA8B469D75EDEA|AA0DCB47D56788A4|72003DBDD9F8D538|641EEC51117E0BFA|1C327FAC8456FD57)"
    - "s=(C0242BD9356F87A5|A643492C494044C5|3CB32FB9535B6C48)"
    - "s=(07DB346810331B5D|6031C3CBEC6D7735|BB19DDAB7ED55260|8D3E83E06BBE610D)"
    - "s=(FA25BC109CE1BC8E|411EA199BA8D66DC|1210FC20B6630F5A)"
    - "s=(FD30BE3DE6B01CCC|A912AF1614E482B9|C287455B73D24EC8|1ACD7AB5619C9F6C|11500B4D19C095F1|4E8C3D7CD073FECF)"
    - "s=(C8F2A38D8E20DACF|6AA20FB5F84C14FD|BF86F5C8FDA506B8|71ACC5B0CDFFC313)"
  max_links: 40
