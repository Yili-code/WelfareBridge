notes: >-
  桃園市各區公所共用樣板（Taoyuan CCMS，與 sab.tycg.gov.tw 同款）。內容頁主內容區 #CCMS_Content；首頁沒有 #CCMS_Content（只有 #base-content），
  第二個 selector 只為了讓 base_url 驗證不被當成空殼回應。
  網址型態：分類目錄 cl.aspx?n=<單元>、靜態頁 cp.aspx?n=<單元>、清單 News.aspx?n=<單元>&sms=<子單元>（可加 &_CSN=<類別> 篩選，827=社會福利、889=社會救助）、
  文章 News_Content.aspx?n=<單元>&s=<文章>。附件一律在 https://ws.tycg.gov.tw/Download.ashx?u=<base64 路徑>&n=<base64 檔名>&icon=.pdf。
  中壢區公所沒有「社會課業務簡介」單元：唯一寫出資格＋金額的 HTML 方案頁是「特殊境遇家庭扶助專區」(n=6431) 的年度文章；
  其他社福業務（低收／中低收、弱勢兒少、急難救助、國民年金、生育津貼、育兒津貼）只在「下載專區＞民眾常用檔案下載」(News.aspx?n=6379&sms=11393) 以附件 PDF 提供申請規定或申請表。
