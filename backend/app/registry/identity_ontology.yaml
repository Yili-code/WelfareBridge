# 身分本體（資料，不是程式）。
# - id：標籤 id；label：規則與 UI 顯示用的標準名稱；aliases：原文與使用者文字中的同義詞（會再由語料統計補充）
# - attribute：對應的 profile 屬性（boolean）；implies：具備此身分即視為具備的其他身分；basis：依據
# - virtual: true 的標籤沒有對應屬性，只能由 implies 推得（例如「弱勢學生」）
version: 2
tags:
  - {id: low_income, label: 低收入戶, aliases: [低收, 低收入家庭, 列冊低收入戶, 低收入戶學生], attribute: identity.low_income, implies: [economic_hardship, disadvantaged]}
  - {id: middle_low_income, label: 中低收入戶, aliases: [中低收, 中低收入家庭, 中低收入戶學生], attribute: identity.middle_low_income, implies: [economic_hardship, disadvantaged]}
  - {id: economic_hardship, label: 清寒, aliases: [家境清寒, 清寒家庭, 清寒學生, 家庭經濟困難, 經濟困難], attribute: identity.economic_hardship, implies: [disadvantaged]}
  - {id: special_circumstances, label: 特殊境遇家庭, aliases: [特殊境遇, 特境家庭, 特境], attribute: identity.special_circumstances, implies: [disadvantaged]}
  - {id: disadvantaged, label: 弱勢學生, aliases: [弱勢, 經濟弱勢, 弱勢家庭, 弱勢族群], virtual: true, basis: 教育部大專校院弱勢學生助學計畫：低收入戶、中低收入戶、特殊境遇家庭、身心障礙、原住民等}
